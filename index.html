<style>

html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}

.enemy-hit{animation:enemyHit .14s ease-out}

#enemy-name{font-size:clamp(20px,5vw,30px);font-weight:bold;text-shadow:2px 2px 0 rgba(0,0,0,.4);margin-top:5px}

@keyframes damageUp{0%{opacity:1;transform:translateY(0) scale(.8)}30%{transform:translateY(-25px) scale(1.15)}100%{opacity:0;transform:translateY(-100px) scale(1)}}

#attack-button:active{transform:translateY(3px) scale(.98);box-shadow:0 6px 0 #999,0 9px 15px rgba(0,0,0,.25)}
#attack-button:disabled{opacity:.5}
#bottom-area{width:100%;padding:8px 10px calc(8px + env(safe-area-inset-bottom)) 10px;flex-shrink:0}
#gold{text-align:center;font-size:clamp(18px,5vw,28px);margin-bottom:8px;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
#status{text-align:center;font-size:clamp(14px,4vw,20px);min-height:24px;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
#menu-buttons{width:100%;display:flex;gap:8px}
.menu-button{flex:1;min-height:62px;border:0;border-radius:16px;background:rgba(0,0,0,.45);color:white;font-family:"Keifont",sans-serif;font-size:clamp(17px,5vw,27px);box-shadow:0 5px 0 rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}

.modal{position:fixed;inset:0;display:none;justify-content:center;align-items:center;padding:20px;background:rgba(0,0,0,.65);z-index:100;touch-action:manipulation}
.modal.show{display:flex}
.modal-box{width:min(92%,500px);max-height:84vh;overflow-y:auto;padding:22px;border-radius:22px;background:white;color:#222;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);touch-action:pan-y}
.modal-title{font-size:32px;margin-bottom:18px}

/* ========================================

======================================== */

const BOSSES = {

/* ========================================
   ストーリー

======================================== */

    1:["やあ、君が勇者かい？","ああ、そうみたいだね","僕はそらまめ、魔物さ","おやおや、そうキレるなって","君と戦う気はないんだよ","昼飯を食べてくるから","また後で話そうか😏"],

    200:["僕の最近のマイブームは","人間の家でかくれんぼするのがマイブームさ","スリルたっぷりで楽しいだろう？"],
    250:["こんにちは","私はえだまめ","いつもそらまめがお世話になってるね","え？私は誰だって？","私はそらまめの友達よ","とゆうより、そらまめの同居人","そらまめと同じ家で過ごしてるわ","モンスター退治がんばってね"],

    350:["僕そらまめだよ","世界の端っこの向こう側に","人影が見えたんだ","世界の裏側ってやつかな？","行ってみるかい？","おーけー、いこう"],

    525:["ここはドメイン地方らしいね","どうやらこの世界は2つの世界に別れているらしい","さっき居たのが西地方、今いるのが東地方","コンビニに...あ、あ、","ハンバーグ弁当が..ないんだが","西世界限定販売ってやつか","代わりにWlバーガーを食べるとするか"],
    550:["WLバーガーには熊肉が入っているのか、癖が強くて苦手だ","そんなことより、いやハンバーグ弁当の方が大事だが","魔物は、悪い奴だけではないんだ","前に他の魔物にハンバーグ弁当買ってもらったよ","とても美味しかった、特にマヨネーズがね","あと回転寿司のハンバーグ寿司も好きだ、110円って安くないか？","まあ良い魔物は人を襲ったりなんてしないから、戦うことはないだろうが"],
    600:["この先は凶悪な魔物の住処だ","人を殺して逮捕されたが脱獄したようなやつらだ","ぜひそんなクズどもは殺してくれ","人も襲うゴキブリなんて世界の終わりだろう？"]
};

/* ========================================
   セーブデータ
======================================== */

const SAVE_KEY = "mondou_save";

const gameData = {
    chapter:1,
    monsterNumber:1,
    monsterHP:6000,
    monsterMaxHP:6000,
    attackPower:10,
    gold:0,
    upgradeCost:10,

    playerHP:100,
    playerMaxHP:100,
    hpUpgradeCost:10,

    gachaCoins:0,
    ownedEquipment:{},
    equipmentStars:{},
    equipped:[],
    storySeen:{}
};

let currentEnemy = null;
let bossTimer = null;
let statusTimer = null;
let currentStatus = "";
let storyTimer = null;
let defeatedLock = false;

/* ========================================
   DOM
======================================== */

const $ = id => document.getElementById(id);

/* ========================================
   セーブ / ロード
======================================== */

function saveGame(){
    try{
        localStorage.setItem(SAVE_KEY,JSON.stringify(gameData));
    }catch(error){
        console.error("セーブに失敗しました:",error);
    }
}

function loadGame(){
    try{
        const raw=localStorage.getItem(SAVE_KEY);
        if(!raw)return;

        const saved=JSON.parse(raw);
        if(!saved || typeof saved!=="object")return;

        Object.assign(gameData,saved);

        if(!Array.isArray(gameData.equipped))gameData.equipped=[];
        if(!gameData.ownedEquipment || typeof gameData.ownedEquipment!=="object")gameData.ownedEquipment={};
        if(!gameData.storySeen || typeof gameData.storySeen!=="object")gameData.storySeen={};

        gameData.monsterNumber=Math.max(1,Number(gameData.monsterNumber)||1);
        gameData.playerMaxHP=Math.max(1,Number(gameData.playerMaxHP)||100);
        gameData.playerHP=Math.max(0,Math.min(gameData.playerMaxHP,Number(gameData.playerHP)||gameData.playerMaxHP));
        gameData.gachaCoins=Math.max(0,Number(gameData.gachaCoins)||0);
    }catch(error){
        console.error("ロードに失敗しました:",error);
    }
}

/* ========================================
   敵ステータス
======================================== */

function normalHP(n){

    /*
       敵HP
       1体目   : 100
       50体目  : 2,000
       100体目 : 10,000
       150体目 : 30,000
       200体目 : 100,000
    */

    if(n <= 50){

        return Math.floor(
            100 *
            Math.pow(
                2000 / 100,
                (n - 1) / 49
            )
        );

    }

    if(n <= 100){

        return Math.floor(
            2000 *
            Math.pow(
                10000 / 2000,
                (n - 50) / 50
            )
        );

    }

    if(n <= 150){

        return Math.floor(
            10000 *
            Math.pow(
                30000 / 10000,
                (n - 100) / 50
            )
        );

    }

    return Math.floor(
        30000 *
        Math.pow(
            100000 / 30000,
            Math.min(
                1,
                (n - 150) / 50
            )
        )
    );
}

function normalAttack(n){
    /* 敵攻撃力は緩やかにインフレ */
    return Math.floor(5+n*1.25);
}

function createEnemy(){
    const n=gameData.monsterNumber;
    const boss=isBoss(n);
    const baseHP=normalHP(n);

    currentEnemy={
        number:n,
        boss,
        name:boss?bossName(n):`魔物 ${n}`,
        emoji:boss?(BOSSES[n]?.emoji||"👑"):["👾","🟢","👺","🐺","🐉"][((n-1)%5)],
        maxHP:boss?baseHP*5:baseHP,
        hp:boss?baseHP*5:baseHP,
        attack:boss
            ? ({50:20,100:25,150:30,200:35}[n] || 35)
            : normalAttack(n)
    };

    gameData.monsterMaxHP=currentEnemy.maxHP;
    gameData.monsterHP=currentEnemy.hp;

    updateUI();

    if(boss)startBossTimer();
}

/* ========================================
   装備効果
======================================== */

function getAttackMultiplier(){
    return gameData.equipped.reduce((mult,id)=>{
        const e=EQUIPMENT.find(x=>x.id===id);
        return mult*(e?e.attack:1);
    },1);
}

function getResistance(type){
    let resistance=0;

    for(const id of gameData.equipped){
        const e=EQUIPMENT.find(x=>x.id===id);
        if(!e)continue;
        resistance+=e.resist?.[type]||0;
        resistance+=e.allResist||0;
    }

    return Math.min(1,resistance);
}

/* ========================================
   UI
======================================== */

function updateUI(){
    if(!currentEnemy)return;

    const hp=Math.max(0,currentEnemy.hp);
    const maxHP=Math.max(1,currentEnemy.maxHP);

    $("enemy-name").textContent=currentEnemy.boss
        ? `👑 ${currentEnemy.name}`
        : currentEnemy.name;

    $("hp-text").textContent=`HP ${formatNumber(hp)} / ${formatNumber(maxHP)}`;
    $("hp-bar").style.width=`${Math.max(0,Math.min(100,hp/maxHP*100))}%`;

    $("enemy").textContent=currentEnemy.emoji;
    $("enemy").classList.toggle("boss",currentEnemy.boss);

    $("gold").textContent=`💰 ${formatNumber(gameData.gold)} G　🪙 ${gameData.gachaCoins}`;

    $("upgrade-info").innerHTML=
        `⚔️ 攻撃力：${formatNumber(gameData.attackPower*getAttackMultiplier())}<br>`+
        `❤️ 最大HP：${formatNumber(gameData.playerMaxHP)}<br>`+
        `⚔️ 攻撃強化：${formatNumber(gameData.upgradeCost)} G<br>`+
        `❤️ HP強化：${formatNumber(gameData.hpUpgradeCost)} G`;

    $("player-hp-text").textContent=
        `❤️ HP ${formatNumber(gameData.playerHP)} / ${formatNumber(gameData.playerMaxHP)}`;

    $("player-hp-bar").style.width=
        `${Math.max(0,Math.min(100,gameData.playerHP/gameData.playerMaxHP*100))}%`;

    $("boss-badge").textContent=currentEnemy.boss
        ? `👑 ${currentEnemy.name}　⚔️ ${formatNumber(currentEnemy.attack)} / 3秒`
        : "";

    $("status-line").textContent=
        currentStatus ||
        (currentEnemy.boss ? (BOSSES[currentEnemy.number]?.special||"") : "👾 通常敵：攻撃してこない");

    renderEquipment();
}

function formatNumber(n){
    if(!Number.isFinite(n))return "∞";
    if(n<10000)return Math.floor(n).toLocaleString("ja-JP");

    const units=["","万","億","兆","京","垓","秭","穣","溝","澗","正","載","極"];
    let x=n,i=0;

    while(x>=10000 && i<units.length-1){
        x/=10000;
        i++;
    }

    return `${Math.floor(x*10)/10}${units[i]}`;
}

/* ========================================
   攻撃
======================================== */

$("attack-button").addEventListener("click",attack);

function attack(){
    if(defeatedLock || !currentEnemy || currentEnemy.hp<=0)return;

    if(currentStatus.includes("氷状態")){
        return;
    }

    const damage=Math.max(1,Math.floor(gameData.attackPower*getAttackMultiplier()));

    currentEnemy.hp=Math.max(0,currentEnemy.hp-damage);
    gameData.monsterHP=currentEnemy.hp;

    $("enemy").classList.remove("enemy-hit");
    void $("enemy").offsetWidth;
    $("enemy").classList.add("enemy-hit");

    showDamage(damage);

    if(currentEnemy.hp<=0){
        defeatMonster();
        return;
    }

    saveGame();
    updateUI();
}

function showDamage(damage){
    const el=document.createElement("div");
    el.className="damage";
    el.textContent=`-${formatNumber(damage)}`;

    const rect=$("enemy").getBoundingClientRect();

    el.style.left=
        `${rect.left+rect.width/2-30+Math.random()*60}px`;

    el.style.top=
        `${rect.top+rect.height/2}px`;

    document.body.appendChild(el);

    setTimeout(()=>el.remove(),800);
}

/* ========================================
   ボス攻撃
======================================== */

function startBossTimer(){
    clearTimeout(bossTimer);
    bossTimer=null;

    if(!currentEnemy || !currentEnemy.boss)return;
    if(Number(currentEnemy.hp)<=0)return;
    if(Number(gameData.playerHP)<=0)return;

    const interval=(gameData.equippedGear==="timeSlow") ? 6000 : 3000;

    bossTimer=setTimeout(()=>{
        bossTimer=null;
        if(!currentEnemy || !currentEnemy.boss)return;
        if(Number(currentEnemy.hp)<=0)return;
        if(Number(gameData.playerHP)<=0)return;

        bossAttack();
    },interval);
}

function bossAttack(){
    if(!currentEnemy || !currentEnemy.boss)return;
    if(Number(currentEnemy.hp)<=0)return;
    if(Number(gameData.playerHP)<=0)return;

    const damage=Math.max(1,Math.floor(Number(currentEnemy.attack)||1));

    if(gameData.equippedGear==="barrier" && Math.random()<0.15){
        showBossMessage("🛡️ バリア！ 攻撃を無効化！");
    }else{
        gameData.playerHP=Math.max(0,Number(gameData.playerHP)-damage);
        showBossMessage(`💥 ${currentEnemy.name||"ボス"}の攻撃！ -${damage}`);
    }

    saveGame();
    updateUI();

    if(Number(gameData.playerHP)<=0){
        showRevenge();
        return;
    }

    startBossTimer();
}

/* ========================================
   撃破
======================================== */

function defeatMonster(){
    if(defeatedLock)return;
    defeatedLock=true;

    clearTimeout(bossTimer);
    bossTimer=null;

    const defeatedNumber=currentEnemy.number;

    /* ゴールド：3 + 5 */
    gameData.gold+=8;

    /* ボス撃破：ガチャコイン1枚 */
    if(isBoss(defeatedNumber)){
        gameData.gachaCoins+=1;
    }

    /* 戦闘終了時にHP全回復 */
    gameData.playerHP=gameData.playerMaxHP;

    gameData.monsterNumber=defeatedNumber+1;
    gameData.chapter=
        gameData.monsterNumber<=350 ? 1 :
        gameData.monsterNumber<=500 ? 2 : 3;

    saveGame();

    /* 敵撃破ではリベンジ画面を表示しない */
    const story=STORIES[defeatedNumber];

    if(story && !gameData.storySeen[defeatedNumber]){
        gameData.storySeen[defeatedNumber]=true;
        saveGame();

        showStory(story,()=>{
            defeatedLock=false;
            createEnemy();
        });
    }else{
        defeatedLock=false;
        createEnemy();
    }
}

/* ========================================
   リベンジ
   すべて引き継ぎ
======================================== */

function showRevenge(){
    clearTimeout(bossTimer);
    bossTimer=null;

    $("defeat-title").textContent="💀 全滅！";
    $("defeat-text").textContent=
        "すべての進行・装備・ゴールド・ガチャコインを引き継いでリベンジできます。";

    $("defeat").classList.add("show");
}

$("revenge-button").addEventListener("click",()=>{
    gameData.playerHP=gameData.playerMaxHP;

    if(currentEnemy){
        currentEnemy.hp=currentEnemy.maxHP;
        gameData.monsterHP=currentEnemy.hp;
    }

    $("defeat").classList.remove("show");

    saveGame();
    updateUI();

    if(currentEnemy?.boss)startBossTimer();
});

/* ========================================
   ストーリー
   5秒ごとに自動で次の文へ
======================================== */

function showStory(lines,done){
    clearTimeout(storyTimer);

    $("story-overlay").classList.add("show");

    let index=0;

    $("story-text").textContent=lines[index];

    function next(){
        clearTimeout(storyTimer);

        index++;

        if(index>=lines.length){
            $("story-overlay").classList.remove("show");
            $("story-next").onclick=null;

            if(done)done();
            return;
        }

        $("story-text").textContent=lines[index];

        storyTimer=setTimeout(next,5000);
    }

    $("story-next").onclick=next;

    storyTimer=setTimeout(next,5000);
}

/* ========================================
   装備 / バッグ
======================================== */

function renderEquipment(){
    const list=$("equipment-list");
    if(!list)return;

    const owned=Object.entries(gameData.ownedEquipment||{})
        .filter(([id,count])=>Number(count)>0);

    if(!owned.length){
        list.innerHTML='<p style="padding:15px">まだ装備を持っていません。</p>';
        return;
    }

    list.innerHTML=owned.map(([id,count])=>{
        const e=(typeof EQUIPMENT!=="undefined")
            ? EQUIPMENT.find(x=>x.id===id)
            : null;
        if(!e)return "";

        const star=(gameData.equipmentStars&&gameData.equipmentStars[id])||0;
        const equipped=Array.isArray(gameData.equipped)&&gameData.equipped.includes(id);

        return `<div class="equip-row ${equipped?"equipped":""}">
            <b>${e.name} ${star?`★${star}`:""}</b>
            ${equipped?'<span class="badge">装備中</span>':""}
            <div class="small">${e.effect||""}<br>所持：${count}</div>
            <button onclick="toggleEquipment('${id}')">${equipped?"外す":"装備する"}</button>
            <button onclick="upgradeEquipment('${id}')">⬆️ アップグレード</button>
            <button onclick="sellEquipment('${id}')">売却 🪙</button>
        </div>`;
    }).join("");
}

window.toggleEquipment=function(id){
    if(!gameData.ownedEquipment || !gameData.ownedEquipment[id])return;
    if(!Array.isArray(gameData.equipped))gameData.equipped=[];

    const i=gameData.equipped.indexOf(id);
    if(i>=0){
        gameData.equipped.splice(i,1);
    }else{
        if(gameData.equipped.length>=3){
            alert("装備は3個までです！");
            return;
        }
        gameData.equipped.push(id);
    }
    saveGame();
    updateUI();
    renderEquipment();
};

window.upgradeEquipment=function(id){
    if(!gameData.ownedEquipment)gameData.ownedEquipment={};
    if(!gameData.equipmentStars)gameData.equipmentStars={};

    const count=Number(gameData.ownedEquipment[id]||0);
    const star=Number(gameData.equipmentStars[id]||0);

    if(star>=30){alert("★30が最大です！");return;}
    if(count<2){alert("同じ装備が2個必要です！");return;}

    gameData.ownedEquipment[id]=count-2;
    gameData.equipmentStars[id]=star+1;

    saveGame();
    updateUI();
    renderEquipment();
};

window.sellEquipment=function(id){
    const count=Number(gameData.ownedEquipment?.[id]||0);
    if(count<=0)return;

    gameData.ownedEquipment[id]=count-1;
    gameData.gachaCoins=(Number(gameData.gachaCoins)||0)+1;

    if(gameData.ownedEquipment[id]<=0){
        delete gameData.ownedEquipment[id];
        if(Array.isArray(gameData.equipped)){
            gameData.equipped=gameData.equipped.filter(x=>x!==id);
        }
    }

    saveGame();
    updateUI();
    renderEquipment();
}

function rollGacha(){
    if(gameData.gachaCoins<1){
        alert("ガチャコインが足りない！");
        return;
    }

    gameData.gachaCoins--;

    let item;

    /* 氷の鎧だけ5%、残り12種を残り95%で均等 */
    if(Math.random()<0.05){
        item=EQUIPMENT[0];
    }else{
        const rest=EQUIPMENT.slice(1);
        item=rest[Math.floor(Math.random()*rest.length)];
    }

    if(gameData.ownedEquipment[item.id]){
        /* ダブり → コイン1枚 */
        gameData.gachaCoins++;

        $("gacha-result").innerHTML=
            `🎯 ${item.name}<br>ダブり！ → 🪙 ガチャコイン1枚に変換`;
    }else{
        gameData.ownedEquipment[item.id]=1;

        $("gacha-result").innerHTML=
            `🎉 ${item.name} GET！<br>${item.effect}`;
    }

    saveGame();
    updateUI();
}

$("gacha-roll").addEventListener("click",rollGacha);

/* ========================================
   強化
======================================== */

$("hp-upgrade-buy").addEventListener("click",()=>{
    if(gameData.gold<gameData.hpUpgradeCost){
        alert("ゴールドが足りない！");
        return;
    }

    gameData.gold-=gameData.hpUpgradeCost;
    gameData.playerMaxHP+=20;
    gameData.playerHP=gameData.playerMaxHP;
    gameData.hpUpgradeCost=Math.floor(gameData.hpUpgradeCost*1.5);

    saveGame();
    updateUI();
});

$("attack-upgrade-buy").addEventListener("click",()=>{
    if(gameData.gold<gameData.upgradeCost){
        alert("ゴールドが足りない！");
        return;
    }

    gameData.gold-=gameData.upgradeCost;
    gameData.attackPower+=5;
    gameData.upgradeCost=Math.floor(gameData.upgradeCost*1.5);

    saveGame();
    updateUI();
});

/* ========================================
   モーダル
======================================== */

function openModal(id){
    $(id).classList.add("show");
}

function closeModals(){
    document.querySelectorAll(".modal").forEach(modal=>{
        modal.classList.remove("show");
    });
}

$("upgrade-button").addEventListener("click",()=>{
    updateUI();
    openModal("upgrade-modal");
});

$("bag-button").addEventListener("click",()=>{
    updateUI();
    openModal("bag-modal");
});

$("shop-button").addEventListener("click",()=>{
    $("gacha-result").textContent="";
    openModal("shop-modal");
});

$("upgrade-close").addEventListener("click",closeModals);
$("bag-close").addEventListener("click",closeModals);
$("shop-close").addEventListener("click",closeModals);

/* ========================================
   1体目からやり直す
   育成・装備・ゴールド・コイン・ストーリー既読は維持
======================================== */
$("restart-button").addEventListener("click",()=>{
    const ok=confirm("進行度だけを1体目に戻します。\nHP・攻撃力・装備・ゴールド・ガチャコイン・ストーリー既読はそのままです。\n\n1体目からやり直しますか？");
    if(!ok)return;

    clearTimeout(bossTimer);
    clearTimeout(statusTimer);
    clearTimeout(storyTimer);
    bossTimer=null;
    statusTimer=null;
    storyTimer=null;
    currentStatus="";
    defeatedLock=false;

    $("defeat").classList.remove("show");
    $("story-overlay").classList.remove("show");
    closeModals();

    gameData.monsterNumber=1;
    gameData.monsterHP=0;
    gameData.monsterMaxHP=0;
    gameData.playerHP=gameData.playerMaxHP;
    gameData.chapter=1;

    saveGame();
    createEnemy();

    /* 既読ストーリーは維持するため、開始ストーリーは再表示しない */
});

/* ========================================
   起動
======================================== */

loadGame();

createEnemy();

/* 初回ストーリー */
if(gameData.monsterNumber===1 && !gameData.storySeen[1]){
    gameData.storySeen[1]=true;
    saveGame();

    setTimeout(()=>{
        showStory(STORIES[1],()=>updateUI());
    },300);
}
</script>
